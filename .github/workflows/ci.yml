name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }}, Java ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ['21']
        include:
          - os: ubuntu-latest
            java: '17'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4

      # Unit tests plus the integration tests that run the real Gosu compiler and real Gosu tests.
      - name: Build and test
        run: ./gradlew build -PjavaVersion=${{ matrix.java }}

      - name: Mutation test the sample project
        run: ./gradlew :mutation-cli:mutationSample -PjavaVersion=${{ matrix.java }}

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.os }}-java${{ matrix.java }}
          path: sample-gosu-project/build/reports/gosu-mutation/
          if-no-files-found: ignore

  intellij-plugin:
    name: IntelliJ plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Downloads IntelliJ IDEA 2025.3.4, runs the plugin tests (including the bundled command line
      # tool and a headless IDE), builds the plugin zip and checks binary compatibility.
      - name: Test, build and verify the plugin
        run: ./gradlew -p intellij-plugin test buildPlugin verifyPlugin

      - name: Upload plugin
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: gosu-mutation-intellij
          path: intellij-plugin/build/distributions/*.zip
