plugins {
    id 'application'
}

dependencies {
    implementation project(':mutation-core')
    implementation project(':mutation-gosu')
    implementation project(':mutation-runner')
    implementation project(':mutation-report')
    implementation "info.picocli:picocli:${picocliVersion}"
}

application {
    applicationName = 'gosu-mutation'
    mainClass = 'io.gosumutation.cli.Main'
}

// Runs the framework against the bundled demo project:  ./gradlew :mutation-cli:mutationSample
tasks.register('mutationSample', JavaExec) {
    group = 'verification'
    description = 'Runs mutation testing on sample-gosu-project and writes the HTML/JSON reports.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    args 'run', '--project', rootProject.file('sample-gosu-project').absolutePath
}

// Mutation tests one Gosu class taken from another code base:
//   ./gradlew :mutation-cli:mutateClass -PsourceFile=<path to the .gs file> -PtrialDir=<trial project dir>
// The class is copied into <trialDir>/src/main/gosu/<package path>/ (the original file is only read)
// and only that class is mutated. The trial project holds the tests in src/test/gosu and,
// optionally, stand-ins for types the class needs in src/stubs/gosu (compiled, never mutated).
// Extra CLI options can be passed with -PmutationArgs="--threads 2 --timeout 120".
tasks.register('mutateClass', JavaExec) {
    group = 'verification'
    description = 'Copies one Gosu class into a trial project and mutation tests it. Needs -PsourceFile and -PtrialDir.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass

    def sourceFileProperty = providers.gradleProperty('sourceFile')
    def trialDirProperty = providers.gradleProperty('trialDir')
    def extraArgsProperty = providers.gradleProperty('mutationArgs')

    doFirst {
        if (!sourceFileProperty.present || !trialDirProperty.present) {
            throw new GradleException('Usage: gradlew :mutation-cli:mutateClass -PsourceFile=<path to the .gs file> -PtrialDir=<trial project dir>')
        }
        def source = new File(sourceFileProperty.get()).absoluteFile
        if (!source.isFile() || !source.name.endsWith('.gs')) {
            throw new GradleException("Not a Gosu class file: ${source}")
        }
        def packageMatch = source.getText('UTF-8') =~ /(?m)^\s*package\s+([\w.]+)/
        if (!packageMatch.find()) {
            throw new GradleException("No package declaration found in ${source}")
        }
        def packageName = packageMatch.group(1)
        def className = packageName + '.' + source.name.substring(0, source.name.length() - 3)

        def trial = new File(trialDirProperty.get()).absoluteFile
        def testDir = new File(trial, 'src/test/gosu')
        def stubsDir = new File(trial, 'src/stubs/gosu')
        def hasGosuFiles = { File dir ->
            dir.isDirectory() && java.nio.file.Files.walk(dir.toPath()).withCloseable { paths ->
                paths.anyMatch { it.toString().endsWith('.gs') }
            }
        }
        if (!hasGosuFiles(testDir)) {
            def nested = trial.isDirectory() ? (trial.listFiles().findAll { it.isDirectory() && new File(it, 'src/test/gosu').isDirectory() }) : []
            throw new GradleException("No Gosu tests found in ${testDir}.\n"
                    + "Expected layout:\n"
                    + "  ${trial}${File.separator}src${File.separator}test${File.separator}gosu${File.separator}<package>${File.separator}<Class>Test.gs   (tests, required)\n"
                    + "  ${trial}${File.separator}src${File.separator}stubs${File.separator}gosu${File.separator}...                 (stand-in types, optional)\n"
                    + (nested ? "Found src${File.separator}test${File.separator}gosu one level deeper, in ${nested*.path.join(', ')}: "
                        + "move its contents up to ${trial} or pass that folder as -PtrialDir.\n" : '')
                    + 'If you extracted a zip, check that it did not create an extra folder level.')
        }

        def targetDir = new File(trial, 'src/main/gosu/' + packageName.replace('.', '/'))
        targetDir.mkdirs()
        java.nio.file.Files.copy(source.toPath(), new File(targetDir, source.name).toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle("Copied ${source} to ${targetDir}")

        def cliArgs = ['run', '--project', trial.path, '--class', className, '--test-dir', 'src/test/gosu']
        if (stubsDir.isDirectory()) {
            cliArgs += ['--test-dir', 'src/stubs/gosu']
            logger.lifecycle("Using stand-in types from ${stubsDir}")
        } else {
            logger.lifecycle("No ${stubsDir}: every type the class uses must come from Gosu, the JDK or --classpath")
        }
        if (extraArgsProperty.present) {
            cliArgs += extraArgsProperty.get().tokenize()
        }
        args cliArgs
    }
}

tasks.named('test') {
    systemProperty 'sample.project.dir', rootProject.file('sample-gosu-project').absolutePath
}
